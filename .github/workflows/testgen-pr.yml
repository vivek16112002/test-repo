name: TestGen

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths: ["src/**", "app/**", "lib/**", "agents/node/testgen/src/**"]

concurrency:
  group: testgen-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  testgen:
    if: >
      github.actor != 'github-actions[bot]' &&
      (github.event.action != 'labeled' || github.event.label.name == 'agent:testgen' || github.event.label.name == 'unit-agent:run')
    uses: ./.github/workflows/_agent-testgen-reusable.yml
    permissions:
      contents: write
      pull-requests: write
      actions: read
    with:
      config-path: .unit-agent.yml
      approval-environment: unit-agent-approval
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COMMIT_PAT: ${{ secrets.UNIT_AGENT_COMMIT_PAT }}
